[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-soundscape"
version = "0.1.0"
description = "Traceable audio collection tools for terminal simulations"
requires-python = ">=3.10"

[project.scripts]
soundscape = "soundscape.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
